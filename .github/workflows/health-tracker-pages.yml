name: Deploy health-tracker to Pages

# 2週間体調記録アプリ(health-tracker/)を GitHub Pages に公開する。
# 本体(株価分析)のCI/デプロイとは独立。health-tracker/ 配下の変更時のみ動作。

on:
  push:
    branches:
      - main
      - claude/health-tracking-reminder-app-xlimeu
    paths:
      - "health-tracker/**"
      - ".github/workflows/health-tracker-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload health-tracker as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: health-tracker

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
