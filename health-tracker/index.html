<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6ea5">
<title>2週間 体調記録</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%222%E9%80%B1%E9%96%93%E4%BD%93%E8%AA%BF%E8%A8%98%E9%8C%B2%22%2C%22short_name%22%3A%22%E4%BD%93%E8%AA%BF%E8%A8%98%E9%8C%B2%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f8%22%2C%22theme_color%22%3A%22%233b6ea5%22%7D">
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1f2933; --sub:#62707d;
    --line:#e3e8ee; --accent:#3b6ea5; --accent-d:#2c5680;
    --good:#3a9d6e; --warn:#d98324; --bad:#cf5b5b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:#fff; padding:14px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  header h1{margin:0;font-size:18px;font-weight:700}
  header .meta{font-size:12.5px;opacity:.92;margin-top:2px}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .progress{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .progress .bar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
  .progress .bar>span{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
  .progress .num{font-size:13px;color:var(--sub);white-space:nowrap}
  .dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .dot{
    width:26px;height:26px;border-radius:7px;font-size:11px;
    display:flex;align-items:center;justify-content:center;
    background:var(--line);color:var(--sub);border:1px solid transparent;
  }
  .dot.done{background:var(--good);color:#fff}
  .dot.today{border-color:var(--accent);font-weight:700;box-shadow:0 0 0 2px rgba(59,110,165,.18)}
  .dot.future{opacity:.5}
  label.field{display:block;margin:14px 0 0}
  label.field > .q{font-weight:600;font-size:14.5px;display:block;margin-bottom:6px}
  label.field .hint{font-weight:400;color:var(--sub);font-size:12px}
  input[type=number],input[type=time],input[type=date],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:#fcfdfe;color:var(--ink);
  }
  textarea{min-height:64px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .scale{display:flex;gap:6px;margin-top:2px}
  .scale button{
    flex:1;padding:9px 0;border:1px solid var(--line);background:#fcfdfe;
    border-radius:10px;font-size:15px;font-weight:600;color:var(--sub);cursor:pointer;
  }
  .scale button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .scale-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}
  .btn{
    display:block;width:100%;padding:13px;border:none;border-radius:12px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
    margin-top:18px;
  }
  .btn:active{background:var(--accent-d)}
  .btn.secondary{background:#eef2f6;color:var(--accent-d)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:600;font-size:14px;padding:10px;margin-top:8px}
  .saved{text-align:center;color:var(--good);font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
  .sectionTitle{font-size:13px;font-weight:700;color:var(--sub);text-transform:none;margin:2px 0 10px;letter-spacing:.02em}
  .navday{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  .navday button{background:#eef2f6;border:none;border-radius:8px;width:38px;height:34px;font-size:18px;color:var(--accent-d);cursor:pointer}
  .navday .label{font-weight:700;font-size:15px;text-align:center;flex:1}
  details summary{cursor:pointer;font-weight:600;color:var(--accent-d);font-size:14px}
  .remindbox{font-size:13px;color:var(--sub)}
  .pill{display:inline-block;background:#eef2f6;color:var(--accent-d);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px}
  .muted{color:var(--sub);font-size:12.5px}
  table.export{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.export th,table.export td{border:1px solid var(--line);padding:4px 6px;text-align:left}
  table.export th{background:#f0f4f8}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#1f2933;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:50;max-width:90%;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>2週間 体調記録</h1>
  <div class="meta" id="headerMeta">毎日かんたんに記録 ・ データは端末内だけに保存</div>
</header>

<div class="wrap">

  <!-- 進捗 -->
  <div class="card">
    <div class="progress">
      <div class="bar"><span id="progBar"></span></div>
      <div class="num" id="progNum">0 / 14 日</div>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- リマインド -->
  <div class="card">
    <div class="sectionTitle">⏰ 毎日のリマインド</div>
    <div class="remindbox">
      <label class="field" style="margin-top:0">
        <span class="q">通知する時刻</span>
        <input type="time" id="remindTime" value="22:00">
      </label>
      <button class="btn secondary" id="enableNotify" style="margin-top:12px">📱 この端末で通知をオンにする</button>
      <button class="btn ghost" id="dlIcs">📅 カレンダーに14日分の毎日リマインドを追加（.ics）</button>
      <p class="muted" style="margin-top:10px">
        通知オンはアプリ（この画面）を開いている／ホーム追加した時に届きます。確実に毎日鳴らすには
        <b>.ics をスマホのカレンダーに取り込む</b>のがおすすめです。
      </p>
    </div>
  </div>

  <!-- 記録フォーム -->
  <div class="card">
    <div class="navday">
      <button id="prevDay" title="前の日">‹</button>
      <div class="label" id="dayLabel">今日</div>
      <button id="nextDay" title="次の日">›</button>
    </div>
    <div class="muted" id="dateSub" style="text-align:center;margin-bottom:6px"></div>

    <form id="form">
      <label class="field">
        <span class="q">😴 睡眠時間 <span class="hint">時間（例: 6.5）。就寝・起床も任意で</span></span>
        <div class="row">
          <input type="number" id="sleepHours" step="0.5" min="0" max="24" placeholder="時間">
          <input type="time" id="bedTime" title="就寝">
          <input type="time" id="wakeTime" title="起床">
        </div>
      </label>

      <label class="field">
        <span class="q">🧠 何を忘れたか <span class="hint">物忘れ・うっかり（なければ空欄）</span></span>
        <textarea id="forgot" placeholder="例: 鍵をどこに置いたか / 約束の時間"></textarea>
      </label>

      <label class="field">
        <span class="q">💼 仕事のミスの内容 <span class="hint">内容・状況（なければ空欄）</span></span>
        <textarea id="mistake" placeholder="例: 送信先を間違えた / 数字の入力ミス"></textarea>
      </label>

      <label class="field">
        <span class="q">🔋 疲労感</span>
        <div class="scale" id="fatigue" data-name="fatigue"></div>
        <div class="scale-legend"><span>0 なし</span><span>5 とても強い</span></div>
      </label>

      <label class="field">
        <span class="q">🌧 気分の落ち込み</span>
        <div class="scale" id="mood" data-name="mood"></div>
        <div class="scale-legend"><span>0 なし</span><span>5 とても強い</span></div>
      </label>

      <label class="field">
        <span class="q">🌅 性欲・朝立ちの変化</span>
        <select id="libido">
          <option value="">選択（任意）</option>
          <option value="増えた">増えた / 強い</option>
          <option value="普段通り">普段通り</option>
          <option value="やや減った">やや減った</option>
          <option value="減った">減った / 弱い</option>
          <option value="ほぼない">ほぼない</option>
        </select>
        <textarea id="libidoNote" placeholder="メモ（任意）" style="margin-top:8px;min-height:44px"></textarea>
      </label>

      <label class="field">
        <span class="q">🍶 飲酒量 <span class="hint">缶/杯/合などの数。飲まない日は 0</span></span>
        <div class="row">
          <input type="number" id="alcoholAmount" step="0.5" min="0" placeholder="量">
          <input type="text" id="alcoholNote" placeholder="種類・メモ（任意）">
        </div>
      </label>

      <button type="submit" class="btn">💾 この日を保存</button>
      <div class="saved" id="savedMsg"></div>
    </form>
  </div>

  <!-- エクスポート -->
  <div class="card">
    <details>
      <summary>📤 データの書き出し・確認 <span class="pill" id="countPill">0件</span></summary>
      <p class="muted" style="margin-top:10px">医師に見せたり、保管するときに使えます。</p>
      <button class="btn secondary" id="dlCsv">CSVをダウンロード</button>
      <button class="btn ghost" id="copyText">📋 テキストでまとめてコピー</button>
      <button class="btn ghost" id="clearAll" style="color:var(--bad)">🗑 全データを削除</button>
      <div id="exportPreview"></div>
    </details>
  </div>

  <p class="muted" style="text-align:center;margin-top:6px">
    🔒 記録は外部に送信されず、この端末のブラウザ内だけに保存されます。
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const LS_KEY = "health2w.entries.v1";
  const LS_CFG = "health2w.config.v1";
  const TRACK_DAYS = 14;

  // ---------- utils ----------
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,"0");
  const todayStr = () => dateStr(new Date());
  function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
  function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return dateStr(d); }
  const WD=["日","月","火","水","木","金","土"];
  function jpLabel(s){ const d=parseDate(s); return (d.getMonth()+1)+"月"+d.getDate()+"日 ("+WD[d.getDay()]+")"; }

  function loadEntries(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||{}; }catch(e){ return {}; } }
  function saveEntries(o){ localStorage.setItem(LS_KEY, JSON.stringify(o)); }
  function loadCfg(){ try{ return JSON.parse(localStorage.getItem(LS_CFG))||{}; }catch(e){ return {}; } }
  function saveCfg(o){ localStorage.setItem(LS_CFG, JSON.stringify(o)); }

  let entries = loadEntries();
  let cfg = loadCfg();
  if(!cfg.startDate){ cfg.startDate = todayStr(); }
  if(!cfg.remindTime){ cfg.remindTime = "22:00"; }
  saveCfg(cfg);

  let viewDate = todayStr();
  // 期間内なら今日、期間前後でも今日を表示
  const fields = ["sleepHours","bedTime","wakeTime","forgot","mistake","fatigue","mood","libido","libidoNote","alcoholAmount","alcoholNote"];

  let toastT;
  function toast(msg){
    const t=$("#toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
  }

  // ---------- scales ----------
  function buildScale(el){
    el.innerHTML="";
    for(let i=0;i<=5;i++){
      const b=document.createElement("button");
      b.type="button"; b.textContent=i; b.dataset.val=i;
      b.addEventListener("click",()=>{
        el.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel"); el.dataset.value=i;
      });
      el.appendChild(b);
    }
  }
  function setScale(el,val){
    el.dataset.value = (val===undefined||val===null||val==="")?"":val;
    el.querySelectorAll("button").forEach(x=>x.classList.toggle("sel", x.dataset.val===String(val)));
  }
  buildScale($("#fatigue")); buildScale($("#mood"));

  // ---------- form <-> entry ----------
  function readForm(){
    return {
      sleepHours: $("#sleepHours").value.trim(),
      bedTime: $("#bedTime").value,
      wakeTime: $("#wakeTime").value,
      forgot: $("#forgot").value.trim(),
      mistake: $("#mistake").value.trim(),
      fatigue: $("#fatigue").dataset.value||"",
      mood: $("#mood").dataset.value||"",
      libido: $("#libido").value,
      libidoNote: $("#libidoNote").value.trim(),
      alcoholAmount: $("#alcoholAmount").value.trim(),
      alcoholNote: $("#alcoholNote").value.trim(),
      updatedAt: new Date().toISOString()
    };
  }
  function fillForm(e){
    e = e||{};
    $("#sleepHours").value=e.sleepHours||"";
    $("#bedTime").value=e.bedTime||"";
    $("#wakeTime").value=e.wakeTime||"";
    $("#forgot").value=e.forgot||"";
    $("#mistake").value=e.mistake||"";
    setScale($("#fatigue"), e.fatigue);
    setScale($("#mood"), e.mood);
    $("#libido").value=e.libido||"";
    $("#libidoNote").value=e.libidoNote||"";
    $("#alcoholAmount").value=e.alcoholAmount||"";
    $("#alcoholNote").value=e.alcoholNote||"";
  }
  function hasContent(e){
    if(!e) return false;
    return ["sleepHours","forgot","mistake","fatigue","mood","libido","libidoNote","alcoholAmount","alcoholNote","bedTime","wakeTime"]
      .some(k => e[k]!==undefined && e[k]!=="" && e[k]!==null);
  }

  // ---------- render ----------
  function render(){
    // header period
    const endDate = addDays(cfg.startDate, TRACK_DAYS-1);
    $("#headerMeta").textContent = jpLabel(cfg.startDate)+" 〜 "+jpLabel(endDate)+" の14日間";

    // day nav
    $("#dayLabel").textContent = (viewDate===todayStr()? "今日 ・ ":"") + jpLabel(viewDate);
    const idx = Math.round((parseDate(viewDate)-parseDate(cfg.startDate))/86400000);
    $("#dateSub").textContent = (idx>=0 && idx<TRACK_DAYS)? ("記録 "+(idx+1)+"日目 / 14") : "（記録期間外）";

    fillForm(entries[viewDate]);

    // progress
    let done=0;
    for(let i=0;i<TRACK_DAYS;i++){ if(hasContent(entries[addDays(cfg.startDate,i)])) done++; }
    $("#progBar").style.width = (done/TRACK_DAYS*100)+"%";
    $("#progNum").textContent = done+" / "+TRACK_DAYS+" 日";

    // dots
    const dots=$("#dots"); dots.innerHTML="";
    for(let i=0;i<TRACK_DAYS;i++){
      const ds=addDays(cfg.startDate,i);
      const el=document.createElement("div");
      el.className="dot";
      el.textContent=i+1;
      el.title=jpLabel(ds);
      if(hasContent(entries[ds])) el.classList.add("done");
      if(ds===todayStr()) el.classList.add("today");
      if(parseDate(ds)>parseDate(todayStr())) el.classList.add("future");
      el.addEventListener("click",()=>{ viewDate=ds; render(); window.scrollTo({top:$("#form").offsetTop-80,behavior:"smooth"}); });
      dots.appendChild(el);
    }

    // count
    const cnt=Object.keys(entries).filter(k=>hasContent(entries[k])).length;
    $("#countPill").textContent=cnt+"件";

    // remind time
    $("#remindTime").value = cfg.remindTime;
  }

  // ---------- nav ----------
  $("#prevDay").addEventListener("click",()=>{ viewDate=addDays(viewDate,-1); render(); });
  $("#nextDay").addEventListener("click",()=>{ viewDate=addDays(viewDate,1); render(); });

  // ---------- save ----------
  $("#form").addEventListener("submit",ev=>{
    ev.preventDefault();
    entries[viewDate]=readForm();
    saveEntries(entries);
    const m=$("#savedMsg"); m.textContent="✓ 保存しました（"+jpLabel(viewDate)+"）";
    setTimeout(()=>{ if(m.textContent.indexOf("✓")===0) m.textContent=""; }, 2600);
    render();
    toast("保存しました");
  });

  // ---------- remind time ----------
  $("#remindTime").addEventListener("change",e=>{
    cfg.remindTime=e.target.value||"22:00"; saveCfg(cfg);
    scheduleLocalNotify();
    toast("リマインド時刻を "+cfg.remindTime+" に設定");
  });

  // ---------- local (in-page) notification ----------
  let notifTimer=null;
  function scheduleLocalNotify(){
    if(notifTimer){ clearTimeout(notifTimer); notifTimer=null; }
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    const [h,m]=cfg.remindTime.split(":").map(Number);
    const now=new Date();
    const next=new Date(); next.setHours(h,m,0,0);
    if(next<=now) next.setDate(next.getDate()+1);
    const ms=next-now;
    notifTimer=setTimeout(()=>{
      const t=todayStr();
      if(!hasContent(entries[t])){
        try{ new Notification("体調記録の時間です 📝",{body:"今日の睡眠・気分・体調などを記録しましょう。",tag:"health2w"}); }catch(e){}
      }
      scheduleLocalNotify();
    }, ms);
  }
  $("#enableNotify").addEventListener("click",async()=>{
    if(!("Notification" in window)){ toast("この端末は通知に未対応です"); return; }
    let p=Notification.permission;
    if(p!=="granted") p=await Notification.requestPermission();
    if(p==="granted"){
      scheduleLocalNotify();
      try{ new Notification("通知をオンにしました ✅",{body:"毎日 "+cfg.remindTime+" にお知らせします（アプリを開いている間）。"}); }catch(e){}
      toast("通知オン");
    }else{
      toast("通知が許可されませんでした");
    }
  });

  // ---------- ICS (calendar reminder) ----------
  function pad2(n){return String(n).padStart(2,"0");}
  function buildICS(){
    const [h,m]=cfg.remindTime.split(":").map(Number);
    const start=parseDate(cfg.startDate);
    const dt = (d)=> d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"T"+pad2(h)+pad2(m)+"00";
    const end = new Date(start); end.setHours(h, m+15, 0, 0);
    const dtend = end.getFullYear()+pad2(end.getMonth()+1)+pad2(end.getDate())+"T"+pad2(end.getHours())+pad2(end.getMinutes())+"00";
    const stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    const lines=[
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//health2w//JP","CALSCALE:GREGORIAN","METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:health2w-"+Date.now()+"@local",
      "DTSTAMP:"+stamp,
      "DTSTART:"+dt(start),
      "DTEND:"+dtend,
      "RRULE:FREQ=DAILY;COUNT="+TRACK_DAYS,
      "SUMMARY:体調記録をつける 📝",
      "DESCRIPTION:睡眠・物忘れ・仕事のミス・疲労感・気分・性欲/朝立ち・飲酒量を記録",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:体調記録の時間です","TRIGGER:PT0M","END:VALARM",
      "END:VEVENT","END:VCALENDAR"
    ];
    return lines.join("\r\n");
  }
  function download(name, content, type){
    const blob=new Blob([content],{type:type||"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  $("#dlIcs").addEventListener("click",()=>{
    download("体調記録-毎日リマインド.ics", buildICS(), "text/calendar;charset=utf-8");
    toast("カレンダーファイルを保存しました");
  });

  // ---------- export ----------
  const COLS=[
    ["date","日付"],["sleepHours","睡眠時間"],["bedTime","就寝"],["wakeTime","起床"],
    ["forgot","忘れたこと"],["mistake","仕事のミス"],["fatigue","疲労感"],["mood","気分の落ち込み"],
    ["libido","性欲/朝立ち"],["libidoNote","性欲メモ"],["alcoholAmount","飲酒量"],["alcoholNote","飲酒メモ"]
  ];
  function sortedDates(){ return Object.keys(entries).filter(k=>hasContent(entries[k])).sort(); }
  function csvCell(v){ v=(v===undefined||v===null)?"":String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  function buildCSV(){
    const head=COLS.map(c=>c[1]).join(",");
    const rows=sortedDates().map(d=>{
      const e=entries[d];
      return COLS.map(c=> c[0]==="date"? d : csvCell(e[c[0]])).join(",");
    });
    return "﻿"+[head].concat(rows).join("\n");
  }
  $("#dlCsv").addEventListener("click",()=>{
    if(sortedDates().length===0){ toast("まだ記録がありません"); return; }
    download("体調記録.csv", buildCSV(), "text/csv;charset=utf-8");
    toast("CSVを保存しました");
  });
  $("#copyText").addEventListener("click",async()=>{
    const ds=sortedDates();
    if(ds.length===0){ toast("まだ記録がありません"); return; }
    let txt="■ 2週間 体調記録\n";
    ds.forEach(d=>{
      const e=entries[d];
      txt+="\n【"+jpLabel(d)+"】\n";
      txt+="睡眠: "+(e.sleepHours||"-")+"時間"+(e.bedTime?(" ("+e.bedTime+"→"+(e.wakeTime||"?")+")"):"")+"\n";
      txt+="疲労感: "+(e.fatigue||"-")+"/5  気分の落ち込み: "+(e.mood||"-")+"/5\n";
      if(e.forgot) txt+="忘れた: "+e.forgot+"\n";
      if(e.mistake) txt+="仕事ミス: "+e.mistake+"\n";
      if(e.libido||e.libidoNote) txt+="性欲/朝立ち: "+(e.libido||"")+(e.libidoNote?(" / "+e.libidoNote):"")+"\n";
      txt+="飲酒: "+(e.alcoholAmount||"0")+(e.alcoholNote?(" ("+e.alcoholNote+")"):"")+"\n";
    });
    try{ await navigator.clipboard.writeText(txt); toast("コピーしました"); }
    catch(e){ window.prompt("コピーしてください:", txt); }
  });
  $("#clearAll").addEventListener("click",()=>{
    if(confirm("すべての記録を削除します。よろしいですか？")){
      entries={}; saveEntries(entries); render(); toast("削除しました");
    }
  });

  // ---------- init ----------
  render();
  scheduleLocalNotify();
  // 画面復帰時に通知タイマー再設定
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) scheduleLocalNotify(); });
})();
</script>
</body>
</html>
